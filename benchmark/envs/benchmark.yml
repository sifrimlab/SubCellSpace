# The environment the three notebooks need, pinned to the versions the reported
# numbers were produced with. scikit-learn is the pin that matters most: it is the
# forest every method is scored through, and the shipped SubCellSpace classifiers
# only unpickle against a compatible version.
#
# Bring your own Jupyter -- `ipykernel` registers this environment as a kernel.
# Regenerating the embeddings needs each tool's own environment instead; see
# scripts/README.md.
#
# Solve it with mamba, or with conda >= 23.10 where libmamba is the default:
#     mamba env create -f envs/benchmark.yml
# conda's classic solver does not finish on this many exact pins.
# Verified to solve to these exact versions (217 packages, 298 MB).
name: benchmark
channels:
  - conda-forge
dependencies:
  - python=3.9
  - numpy=1.23.5
  - pandas=1.5.3
  - scipy=1.10.0
  - scikit-learn=1.2.0
  - scikit-image=0.19
  - anndata=0.9.2
  - awkward=2.6.6
  - h5py=3.8.0
  - pyarrow=12.0.1
  - openpyxl=3.1.5
  - matplotlib-base=3.6.3
  - tqdm=4.64.1
  - joblib          # reads image files in parallel; version is not load-bearing
  - ipython
  - ipykernel
